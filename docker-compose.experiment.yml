# Single-vLLM-instance compose for the transcription-summarisation experiment.
#
# Runs one vLLM instance at a time; the orchestration script (99_run_all.sh) swaps
# candidate and judge models between stages. HuggingFace model weights are cached in
# the named volume `vllm-cache` so re-pulls are skipped across runs.
#
# Per-stage overrides via env vars (or a .env next to this file):
#   MODEL                 model id loaded in vLLM (HF-style)
#   QUANTIZATION          "awq_marlin" for AWQ candidates, "" for BF16/FP8
#   GPU_MEMORY_UTILIZATION  0.18 default (live); raise for the 27B FP8 judge (~0.55)
#   MAX_NUM_SEQS          16 (live default); raise for embedding endpoint
#
# Usage:
#   # Candidate model (BF16):
#   MODEL=Qwen/Qwen3.5-4B QUANTIZATION= docker compose -f docker-compose.experiment.yml up -d
#
#   # Candidate model (AWQ):
#   MODEL=Qwen/Qwen3.5-4B-AWQ QUANTIZATION=awq_marlin \
#     docker compose -f docker-compose.experiment.yml up -d
#
#   # Judge model (27B FP8 dense):
#   MODEL=Qwen/Qwen3.6-27B-Instruct-FP8 QUANTIZATION= GPU_MEMORY_UTILIZATION=0.55 \
#     docker compose -f docker-compose.experiment.yml up -d
#
# Endpoint: http://localhost:11434/v1/chat/completions

services:
  vllm:
    image: vllm/vllm-openai:v0.20.0
    container_name: experiment-vllm
    restart: "no"
    ports:
      - "127.0.0.1:11434:8000"
    command: >
      ${MODEL}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --max-num-seqs ${MAX_NUM_SEQS:-16}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.18}
      ${QUANTIZATION:+--quantization ${QUANTIZATION}}
      --dtype auto
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --default-chat-template-kwargs '{"enable_thinking": false}'
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vllm-cache:/root/.cache
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  vllm-cache:
